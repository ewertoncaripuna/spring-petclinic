name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # histórico completo, não só o último commit

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  trivy-fs:
    name: Scan de dependências (CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  trivy-config:
    name: Scan de manifests (IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: deploy/
          severity: HIGH,CRITICAL
          exit-code: '1'
